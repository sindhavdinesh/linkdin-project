<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quantum Quiz | Interactive Challenge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1120 0%, #19233c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
    }

    /* animated background particles effect */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* main quiz container */
    .quiz-container {
      max-width: 850px;
      width: 100%;
      background: rgba(18, 25, 45, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 3rem;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* header with title, timer, score */
    .quiz-header {
      padding: 1.5rem 2rem;
      background: rgba(10, 16, 30, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .title-badge h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #E0E7FF, #A5B4FC);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .title-badge p {
      color: #8a99cc;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 2rem;
      padding: 0.5rem 1.2rem;
      text-align: center;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,240,0.15);
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9aa9cf;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f0f3ff;
      line-height: 1.2;
    }

    .timer-box {
      background: #0f172ad9;
      border-left: 3px solid #facc15;
    }

    .timer-value {
      color: #facc15;
      font-family: monospace;
      font-size: 1.9rem;
    }

    /* main content */
    .quiz-body {
      padding: 2rem 2rem 2rem 2rem;
    }

    .question-text {
      font-size: 1.7rem;
      font-weight: 600;
      line-height: 1.3;
      color: #f1f5f9;
      margin-bottom: 2rem;
      background: rgba(255,255,245,0.03);
      padding: 0.5rem 0;
      border-left: 4px solid #818cf8;
      padding-left: 1.2rem;
    }

    /* options grid */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .option {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 1.5rem;
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .option:hover {
      background: rgba(56, 78, 110, 0.7);
      transform: translateX(6px);
      border-color: #94a3b8;
    }

    .option.selected {
      background: linear-gradient(95deg, #3b4e7a, #2d3a5e);
      border-left: 6px solid #facc15;
      border-color: #facc15;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }

    .option-prefix {
      font-weight: 800;
      font-size: 1.3rem;
      width: 40px;
      color: #cbd5e1;
    }

    .option-text {
      font-size: 1.05rem;
      font-weight: 500;
      color: #eef2ff;
      flex: 1;
    }

    /* buttons & navigation */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #1e293b;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      color: #e2e8f0;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn.primary {
      background: #4f46e5;
      color: white;
      box-shadow: 0 8px 20px -6px #4f46e5;
    }

    .nav-btn.primary:hover {
      background: #6366f1;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .reset-btn {
      background: #2d374b;
      color: #facc15;
      border: 1px solid #facc1533;
    }

    /* progress indicator */
    .progress-wrapper {
      margin-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .progress-bar-bg {
      background: #1e293b;
      border-radius: 20px;
      height: 8px;
      width: 70%;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #facc15, #f97316);
      width: 0%;
      height: 100%;
      border-radius: 20px;
      transition: width 0.2s ease;
    }

    /* result card styling */
    .result-screen {
      text-align: center;
      padding: 1rem 0;
    }

    .score-circle {
      background: radial-gradient(circle at 30% 10%, #1f2a48, #0b0f1a);
      width: 170px;
      height: 170px;
      margin: 1rem auto;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px -5px black;
      border: 2px solid rgba(250,204,21,0.5);
    }

    .final-score {
      font-size: 3.2rem;
      font-weight: 800;
      color: #facc15;
    }

    .congrats {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 1rem 0;
      background: linear-gradient(120deg, #E0E7FF, #C7D2FE);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .message {
      color: #a0afcf;
      margin-bottom: 2rem;
    }

    /* responsiveness */
    @media (max-width: 620px) {
      .quiz-container {
        border-radius: 2rem;
      }
      .quiz-header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .stats {
        justify-content: center;
      }
      .question-text {
        font-size: 1.3rem;
      }
      .option-text {
        font-size: 0.9rem;
      }
      .quiz-body {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container" id="quizApp">
  <div class="quiz-header">
    <div class="title-badge">
      <h1>⚡ Quantum Quiz</h1>
      <p>test your knowledge • timed challenge</p>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">SCORE</div>
        <div class="stat-value" id="scoreDisplay">0</div>
      </div>
      <div class="stat-card timer-box">
        <div class="stat-label">TIME LEFT</div>
        <div class="stat-value timer-value" id="timerDisplay">00</div>
      </div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <!-- dynamic content injected via JS -->
  </div>
</div>

<script>
  // ---------- QUIZ DATA ----------
  const QUIZ_SET = [
    {
      question: "What does HTML stand for?",
      options: ["Hyper Text Markup Language", "Home Tool Markup Language", "Hyperlinks and Text Markup", "Hyper Text Making Language"],
      correct: 0
    },
    {
      question: "Which CSS property is used to change the background color?",
      options: ["bgcolor", "background-color", "color-background", "background"],
      correct: 1
    },
    {
      question: "Which JavaScript keyword is used to declare a variable?",
      options: ["var", "let", "const", "All of the above"],
      correct: 3
    },
    {
      question: "What does the 'localStorage' in web browsers allow?",
      options: ["Store data with no expiration", "Store temporary session data", "Store cookies only", "Store server-side data"],
      correct: 0
    },
    {
      question: "Which of the following is a JavaScript framework?",
      options: ["React", "Django", "Flask", "Laravel"],
      correct: 0
    },
    {
      question: "In CSS, what does 'flex' do?",
      options: ["Creates flexible layout model", "Adds flex animation", "Manages grid gaps", "Changes font weight"],
      correct: 0
    },
    {
      question: "What is the correct way to write an array in JavaScript?",
      options: ["{1,2,3}", "['apple', 'banana']", "(1,2,3)", "<1,2,3>"],
      correct: 1
    }
  ];

  // ----- GLOBALS -----
  let currentQuestionIndex = 0;
  let userAnswers = new Array(QUIZ_SET.length).fill(null);   // stores selected option index (0-3)
  let quizActive = true;       // false when quiz completed
  let timerInterval = null;
  let timeLeft = 60;           // 60 seconds total for the quiz (countdown)
  const DEFAULT_TIME = 60;

  // DOM elements
  const quizBodyDiv = document.getElementById("quizBody");
  const scoreDisplaySpan = document.getElementById("scoreDisplay");
  const timerDisplaySpan = document.getElementById("timerDisplay");

  // helper: compute current score based on answers
  function computeScore() {
    let total = 0;
    for (let i = 0; i < QUIZ_SET.length; i++) {
      if (userAnswers[i] !== null && userAnswers[i] === QUIZ_SET[i].correct) {
        total++;
      }
    }
    return total;
  }

  // update score UI
  function updateScoreUI() {
    const currentScore = computeScore();
    scoreDisplaySpan.innerText = `${currentScore} / ${QUIZ_SET.length}`;
  }

  // stop timer safely
  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // start timer (only if quiz active & not completed)
  function startTimer() {
    if (timerInterval) stopTimer();
    if (!quizActive) return;
    timerInterval = setInterval(() => {
      if (!quizActive) {
        // if quiz is completed, stop ticking
        return;
      }
      if (timeLeft <= 1) {
        // Time's up! End quiz automatically
        if (quizActive) {
          timeLeft = 0;
          updateTimerUI();
          endQuizDueToTimeout();
        } else {
          stopTimer();
        }
      } else {
        timeLeft--;
        updateTimerUI();
      }
    }, 1000);
  }

  function updateTimerUI() {
    const seconds = timeLeft;
    timerDisplaySpan.innerText = seconds;
    // optional visual warning when low
    if (seconds <= 10) {
      timerDisplaySpan.style.color = "#ff7777";
    } else {
      timerDisplaySpan.style.color = "#facc15";
    }
  }

  // end quiz due to timer
  function endQuizDueToTimeout() {
    if (!quizActive) return;
    stopTimer();
    quizActive = false;
    renderResultScreen("timeout");
  }

  // manual submit / finish quiz
  function finishQuizManually() {
    if (!quizActive) return;
    stopTimer();
    quizActive = false;
    renderResultScreen("complete");
  }

  // render final result with detailed message
  function renderResultScreen(reason = "complete") {
    const finalScore = computeScore();
    const totalQ = QUIZ_SET.length;
    const percentage = Math.round((finalScore / totalQ) * 100);
    let motivationalMsg = "";
    if (percentage === 100) motivationalMsg = "🏆 Flawless! You're a genius!";
    else if (percentage >= 70) motivationalMsg = "🌟 Great job! Keep shining!";
    else if (percentage >= 40) motivationalMsg = "📚 Good attempt! Review and improve.";
    else motivationalMsg = "💪 Never give up! Practice makes perfect!";

    const timeUpNote = (reason === "timeout") ? "⏰ Time's up! " : "✅ Quiz completed! ";

    const resultHTML = `
      <div class="result-screen">
        <div class="score-circle">
          <div class="final-score">${finalScore}/${totalQ}</div>
          <div style="font-size:0.9rem; color:#cbd5e6;">${percentage}%</div>
        </div>
        <div class="congrats">${timeUpNote} ${motivationalMsg}</div>
        <p class="message">Your performance summary: You answered ${finalScore} out of ${totalQ} correctly.</p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
          <button class="nav-btn primary" id="restartQuizBtn">🔄 Take New Quiz</button>
          <button class="nav-btn reset-btn" id="reviewAnswersBtn">📋 Review Answers</button>
        </div>
      </div>
    `;
    quizBodyDiv.innerHTML = resultHTML;
    document.getElementById("restartQuizBtn")?.addEventListener("click", () => restartQuiz());
    document.getElementById("reviewAnswersBtn")?.addEventListener("click", () => showReviewModal());
    updateScoreUI(); // final score visible on header
  }

  // restart everything
  function restartQuiz() {
    stopTimer();
    // reset global state
    currentQuestionIndex = 0;
    userAnswers = new Array(QUIZ_SET.length).fill(null);
    quizActive = true;
    timeLeft = DEFAULT_TIME;
    updateTimerUI();
    updateScoreUI();
    // render first question again
    renderCurrentQuestion();
    startTimer();
  }

  // render review modal (lightweight but elegant)
  function showReviewModal() {
    // create modal overlay
    const modalDiv = document.createElement("div");
    modalDiv.style.position = "fixed";
    modalDiv.style.top = "0";
    modalDiv.style.left = "0";
    modalDiv.style.width = "100%";
    modalDiv.style.height = "100%";
    modalDiv.style.backgroundColor = "rgba(0,0,0,0.85)";
    modalDiv.style.backdropFilter = "blur(8px)";
    modalDiv.style.zIndex = "1000";
    modalDiv.style.display = "flex";
    modalDiv.style.alignItems = "center";
    modalDiv.style.justifyContent = "center";
    modalDiv.style.padding = "1rem";

    const modalCard = document.createElement("div");
    modalCard.style.maxWidth = "650px";
    modalCard.style.width = "100%";
    modalCard.style.backgroundColor = "#0f172ad9";
    modalCard.style.borderRadius = "2rem";
    modalCard.style.border = "1px solid rgba(255,215,0,0.3)";
    modalCard.style.boxShadow = "0 20px 35px -12px black";
    modalCard.style.padding = "1.5rem";
    modalCard.style.color = "white";

    let reviewContent = `<h2 style="margin-bottom: 1rem; font-size:1.8rem;">📋 Answer Review</h2><div style="max-height: 60vh; overflow-y: auto; padding-right: 0.5rem;">`;

    QUIZ_SET.forEach((item, idx) => {
      const userChoice = userAnswers[idx];
      const isCorrect = (userChoice !== null && userChoice === item.correct);
      const statusIcon = isCorrect ? "✅" : (userChoice === null ? "❓ Unattempted" : "❌");
      const correctAnswerText = item.options[item.correct];
      const userAnswerText = (userChoice !== null) ? item.options[userChoice] : "Not answered";
      reviewContent += `
        <div style="background: #1e293b80; margin-bottom: 1rem; border-radius: 1.2rem; padding: 1rem; border-left: 5px solid ${isCorrect ? '#22c55e' : '#ef4444'};">
          <p style="font-weight: bold; margin-bottom: 0.5rem;">Q${idx+1}. ${item.question}</p>
          <p style="font-size:0.85rem;">${statusIcon} Your answer: <span style="color:${isCorrect ? '#bbf7d0' : '#fecaca'}">${userAnswerText}</span></p>
          <p style="font-size:0.85rem;">✔ Correct answer: <span style="color:#facc15;">${correctAnswerText}</span></p>
        </div>
      `;
    });
    reviewContent += `</div><div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;"><button id="closeReviewBtn" class="nav-btn primary" style="background:#334155;">Close</button></div>`;
    modalCard.innerHTML = reviewContent;
    modalDiv.appendChild(modalCard);
    document.body.appendChild(modalDiv);

    const closeBtn = modalDiv.querySelector("#closeReviewBtn");
    closeBtn.addEventListener("click", () => {
      modalDiv.remove();
    });
    modalDiv.addEventListener("click", (e) => {
      if (e.target === modalDiv) modalDiv.remove();
    });
  }

  // handle selecting answer for current question
  function selectAnswer(selectedIndex, optionValueIdx) {
    if (!quizActive) return;
    // update userAnswers array for current question
    userAnswers[currentQuestionIndex] = optionValueIdx;
    updateScoreUI();
    // re-render current question to show selected style
    renderCurrentQuestion();
  }

  // navigation: next / previous
  function nextQuestion() {
    if (!quizActive) return;
    if (currentQuestionIndex < QUIZ_SET.length - 1) {
      currentQuestionIndex++;
      renderCurrentQuestion();
    } else {
      // reached last question and clicked next -> finish quiz (if all attempted or not)
      if (confirm("You are at the last question. Do you want to submit the quiz?") === true) {
        finishQuizManually();
      }
    }
  }

  function prevQuestion() {
    if (!quizActive) return;
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderCurrentQuestion();
    }
  }

  // render active question with options and selection highlight
  function renderCurrentQuestion() {
    if (!quizActive) {
      // if somehow called after completion but restart recover
      return;
    }
    const questionData = QUIZ_SET[currentQuestionIndex];
    const selectedOption = userAnswers[currentQuestionIndex];
    const optionsHtml = questionData.options.map((opt, idx) => {
      const isSelected = (selectedOption === idx);
      const prefixLetter = String.fromCharCode(65 + idx); // A,B,C,D
      return `
        <div class="option ${isSelected ? 'selected' : ''}" data-opt-index="${idx}">
          <div class="option-prefix">${prefixLetter}.</div>
          <div class="option-text">${escapeHtml(opt)}</div>
        </div>
      `;
    }).join('');

    const progressPercent = ((currentQuestionIndex + 1) / QUIZ_SET.length) * 100;

    const mainHtml = `
      <div>
        <div class="question-text">${escapeHtml(questionData.question)}</div>
        <div class="options-list" id="optionsContainer">
          ${optionsHtml}
        </div>
        <div class="action-bar">
          <button class="nav-btn" id="prevBtn" ${currentQuestionIndex === 0 ? 'disabled' : ''}>◀ Previous</button>
          <button class="nav-btn primary" id="nextBtn">${currentQuestionIndex === QUIZ_SET.length-1 ? 'Submit Quiz' : 'Next ▶'}</button>
          <button class="nav-btn reset-btn" id="resetQuizFromMidBtn">⟳ Reset</button>
        </div>
        <div class="progress-wrapper">
          <span>Question ${currentQuestionIndex+1} of ${QUIZ_SET.length}</span>
          <div class="progress-bar-bg"><div class="progress-fill" style="width: ${progressPercent}%;"></div></div>
        </div>
      </div>
    `;

    quizBodyDiv.innerHTML = mainHtml;

    // attach event listeners to each option
    const optionDivs = document.querySelectorAll('.option');
    optionDivs.forEach(optDiv => {
      const optIdx = parseInt(optDiv.dataset.optIndex);
      optDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!quizActive) return;
        selectAnswer(currentQuestionIndex, optIdx);
      });
    });

    // button listeners
    const prevButton = document.getElementById('prevBtn');
    const nextButton = document.getElementById('nextBtn');
    const resetButton = document.getElementById('resetQuizFromMidBtn');

    if (prevButton) prevButton.addEventListener('click', prevQuestion);
    if (nextButton) nextButton.addEventListener('click', nextQuestion);
    if (resetButton) resetButton.addEventListener('click', () => {
      if (confirm("Reset quiz? All progress will be lost.")) {
        restartQuiz();
      }
    });
  }

  // simple XSS prevention
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // initial render and setup
  function initQuiz() {
    quizActive = true;
    currentQuestionIndex = 0;
    userAnswers.fill(null);
    timeLeft = DEFAULT_TIME;
    updateTimerUI();
    updateScoreUI();
    renderCurrentQuestion();
    startTimer();
  }

  // start quiz
  initQuiz();
</script>
</body>
</html>
