<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Modern | Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <main class="app-container">
        <section class="clock-card" aria-label="Digital Clock">
            <div class="date-display" id="date">-- --, ----</div>
            
            <div class="time-display">
                <span id="hours">00</span>
                <span class="separator">:</span>
                <span id="minutes">00</span>
                <span class="separator">:</span>
                <span id="seconds">00</span>
                <div class="period-badge" id="period">AM</div>
            </div>

            <div class="controls">
                <button class="btn" id="formatToggle" aria-label="Toggle Time Format">
                    <span class="btn-label">Format</span>
                    <span class="btn-value" id="formatStatus">24H</span>
                </button>
                <button class="btn" id="themeToggle" aria-label="Toggle Theme">
                    <span class="btn-label">Theme</span>
                    <span class="btn-value" id="themeStatus">Dark</span>
                </button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
