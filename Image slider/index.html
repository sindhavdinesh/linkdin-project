<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Blood-Moon | Neon Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>                                                                                                                               <div id="carousel">
    <div id="bgBlur"></div>

    <div id="slider"></div>
</div> 

    <div class="carousel-container" id="carousel">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <!-- Slides Wrapper -->
        <div class="slider" id="slider">
            <!-- Slides will be injected by JS -->
        </div>

        <!-- Navigation Arrows -->
        <button class="nav-btn prev" id="prevBtn" aria-label="Previous Slide">&#10094;</button>
        <button class="nav-btn next" id="nextBtn" aria-label="Next Slide">&#10095;</button>

        <!-- Navigation Dots -->
        <div class="dots-container" id="dots"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
