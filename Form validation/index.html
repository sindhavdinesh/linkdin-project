<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Form Validation | Login + Signup</title>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .gradient-mesh {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.3) 0%, rgba(34, 211, 238, 0.12) 40%, transparent 70%),
                  radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.2) 0%, rgba(99, 102, 241, 0.15) 60%, transparent 80%);
      animation: slowDrift 24s infinite alternate ease-in-out;
    }

    .noise {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
      opacity: 0.4;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    @keyframes slowDrift {
      0% { transform: scale(1) translate(0%, 0%); opacity: 0.7; }
      100% { transform: scale(1.08) translate(1.5%, 2.5%); opacity: 1; }
    }

    
    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      perspective: 1400px;
    }

    
    .glass-card {
      background: rgba(11, 18, 32, 0.72);
      backdrop-filter: blur(24px) saturate(140%);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s ease;
      transform-style: preserve-3d;
      overflow: hidden;
      position: relative;
    }

    .glass-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 35px 55px -18px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(99, 102, 241, 0.25), 0 0 28px rgba(99, 102, 241, 0.35);
    }

    
    .card-edge-glow {
      position: absolute;
      inset: 0;
      border-radius: 2.5rem;
      padding: 1px;
      background: radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.2), transparent 75%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
    }

    .card-inner {
      padding: 2rem 2rem 2.2rem;
    }

    
    .mode-switch {
      display: flex;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.4rem;
      border-radius: 4rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.75rem 0;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 3rem;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      backdrop-filter: blur(4px);
      font-family: inherit;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(34, 211, 238, 0.7));
      color: white;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
    }

    
    .theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, background 0.2s;
      font-size: 1.2rem;
    }
    .theme-toggle:hover { transform: scale(1.05); background: rgba(99, 102, 241, 0.4); }

    
    .form-panel {
      transition: opacity 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.4s cubic-bezier(0.2, 0.8, 0.4, 1.1), filter 0.3s;
    }
    .form-panel.hidden {
      display: none;
    }
    .panel-enter {
      animation: panelSlideFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes panelSlideFade {
      0% { opacity: 0; transform: translateX(12px); filter: blur(2px); }
      100% { opacity: 1; transform: translateX(0); filter: blur(0); }
    }

    
    .input-group {
      position: relative;
      margin-bottom: 1.8rem;
    }
    .input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.2rem;
      padding: 1rem 1rem 0.6rem 1rem;
      font-size: 1rem;
      color: #f1f5f9;
      transition: all 0.2s ease;
      outline: none;
      font-weight: 450;
      font-family: inherit;
    }
    .input-group label {
      position: absolute;
      left: 1rem;
      top: 0.9rem;
      color: #94a3b8;
      font-size: 0.95rem;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      pointer-events: none;
      background: transparent;
      font-weight: 450;
    }
    
    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: 0.25rem;
      left: 0.9rem;
      font-size: 0.7rem;
      color: #a5b4fc;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    
    .input-group input::placeholder {
      opacity: 0;
      transition: opacity 0.1s;
    }
    .input-group input:focus::placeholder {
      opacity: 0.3;
    }

    
    .input-group.error input {
      border-color: #f43f5e;
      box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.25);
      animation: shakeMicro 0.28s ease-in-out 0s 1;
    }
    @keyframes shakeMicro {
      0%,100%{ transform: translateX(0); }
      25%{ transform: translateX(-3px); }
      75%{ transform: translateX(3px); }
    }
    .input-group.success input {
      border-color: #2dd4bf;
      box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
    }
    .error-msg {
      font-size: 0.7rem;
      color: #f87171;
      margin-top: 0.4rem;
      margin-left: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      animation: slideFadeMsg 0.2s ease;
    }
    @keyframes slideFadeMsg {
      from { opacity: 0; transform: translateY(-4px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .error-msg.hidden {
      display: none;
    }
    .check-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%) scale(0);
      color: #2dd4bf;
      font-size: 1rem;
      font-weight: bold;
      transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      pointer-events: none;
    }
    .input-group.success .check-icon {
      transform: translateY(-50%) scale(1);
    }

    
    .strength-section {
      margin-top: -0.5rem;
      margin-bottom: 1.2rem;
    }
    .strength-bar-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 5px;
      border-radius: 6px;
      overflow: hidden;
    }
    .strength-fill {
      width: 0%;
      height: 100%;
      transition: width 0.25s ease, background 0.2s;
    }
    .strength-label {
      font-size: 0.7rem;
      display: flex;
      justify-content: space-between;
      margin-top: 0.35rem;
      color: #cbd5e1;
    }
    .suggestion-hint {
      font-size: 0.7rem;
      color: #7e8b9f;
      margin-top: 0.2rem;
    }

    
    button.submit-btn {
      width: 100%;
      background: linear-gradient(105deg, #6366f1, #22d3ee);
      border: none;
      padding: 0.9rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      margin-top: 0.8rem;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }
    button.submit-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 22px rgba(99, 102, 241, 0.6);
    }
    .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: rippleAnim 0.5s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }
    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    
    .success-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(14px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0s 0.25s;
    }
    .success-modal.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease;
    }
    .modal-content {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(24px);
      padding: 2rem 2.2rem;
      border-radius: 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: modalPop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    @keyframes modalPop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #5c6b8a;
      letter-spacing: 0.3px;
    }

    
    @media (max-width: 560px) {
      .card-inner { padding: 1.5rem; }
      .mode-btn { font-size: 0.85rem; padding: 0.6rem 0; }
    }
    @media (max-width: 450px) {
      body { padding: 1rem; }
      .input-group input { font-size: 0.9rem; }
    }

    
    body.light {
      background: #eef2ff;
    }
    body.light .glass-card {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.3);
    }
    body.light .input-group input {
      background: rgba(0, 0, 0, 0.03);
      color: #0f172a;
      border-color: rgba(0, 0, 0, 0.12);
    }
    body.light .input-group label {
      color: #475569;
    }
    body.light .strength-label, body.light .suggestion-hint, body.light footer {
      color: #334155;
    }
  </style>
</head>
<body>
<div class="bg-layer">
  <div class="gradient-mesh"></div>
  <div class="noise"></div>
</div>
<div class="auth-container">
  <div class="glass-card" id="glassCard">
    <div class="card-edge-glow"></div>
    <div class="card-inner">
      <div class="mode-switch" id="modeSwitch">
        <button class="mode-btn active" data-mode="login">Sign in</button>
        <button class="mode-btn" data-mode="signup">Create account</button>
      </div>
      <div class="theme-toggle" id="themeToggle">🌙</div>
      
      
      <div id="loginPanel" class="form-panel panel-enter">
        <form id="loginForm" novalidate>
          <div class="input-group" id="loginEmailGroup">
            <input type="email" id="loginEmail" placeholder=" " autocomplete="email">
            <label>Email address</label>
            <div class="error-msg hidden"></div>
            <span class="check-icon">✓</span>
          </div>
          <div class="input-group" id="loginPasswordGroup">
            <input type="password" id="loginPassword" placeholder=" ">
            <label>Password</label>
            <div class="error-msg hidden"></div>
            <span class="check-icon">✓</span>
          </div>
          <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign in →</button>
        </form>
      </div>
      
      
      <div id="signupPanel" class="form-panel hidden">
        <form id="signupForm" novalidate>
          <div class="input-group" id="signupNameGroup">
            <input type="text" id="signupName" placeholder=" " autocomplete="name">
            <label>Full name</label>
            <div class="error-msg hidden"></div>
            <span class="check-icon">✓</span>
          </div>
          <div class="input-group" id="signupEmailGroup">
            <input type="email" id="signupEmail" placeholder=" " autocomplete="email">
            <label>Email address</label>
            <div class="error-msg hidden"></div>
            <span class="check-icon">✓</span>
          </div>
          <div class="input-group" id="signupPasswordGroup">
            <input type="password" id="signupPassword" placeholder=" ">
            <label>Password</label>
            <div class="error-msg hidden"></div>
            <span class="check-icon">✓</span>
          </div>
          <div class="strength-section" id="strengthSection">
            <div class="strength-bar-bg"><div class="strength-fill"></div></div>
            <div class="strength-label"><span id="strengthText">Strength</span><span id="strengthEmoji"></span></div>
            <div class="suggestion-hint" id="passwordHint"></div>
          </div>
          <div class="input-group" id="confirmGroup">
            <input type="password" id="confirmPassword" placeholder=" ">
            <label>Confirm password</label>
            <div class="error-msg hidden"></div>
            <span class="check-icon">✓</span>
          </div>
          <button type="submit" class="submit-btn" id="signupSubmitBtn">Create account →</button>
        </form>
      </div>
      <footer>© Sindhav Dinesh — made by Sindhav Dinesh</footer>
    </div>
  </div>
</div>

<div id="successModal" class="success-modal">
  <div class="modal-content">
    <h3 style="margin-bottom:8px;">✨ Authentication success</h3>
    <p id="modalMessage" style="margin:10px 0;">Welcome</p>
    <button id="closeModal" style="margin-top:1rem; background:#6366f1; border:none; padding:0.6rem 1.4rem; border-radius:2rem; color:white; cursor:pointer; font-weight:600;">Continue</button>
  </div>
</div>

<script>
  // ========================
  // PRODUCTION-GRADE SMART VALIDATION ENGINE
  // ========================
  (function() {
    // DOM Elements
    const loginPanel = document.getElementById('loginPanel');
    const signupPanel = document.getElementById('signupPanel');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const themeToggle = document.getElementById('themeToggle');
    const modal = document.getElementById('successModal');
    const modalMessage = document.getElementById('modalMessage');
    const closeModalBtn = document.getElementById('closeModal');

    // Input fields
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const signupName = document.getElementById('signupName');
    const signupEmail = document.getElementById('signupEmail');
    const signupPassword = document.getElementById('signupPassword');
    const confirmPassword = document.getElementById('confirmPassword');

    // Groups
    const loginEmailGroup = document.getElementById('loginEmailGroup');
    const loginPasswordGroup = document.getElementById('loginPasswordGroup');
    const nameGroup = document.getElementById('signupNameGroup');
    const signupEmailGroup = document.getElementById('signupEmailGroup');
    const signupPassGroup = document.getElementById('signupPasswordGroup');
    const confirmGroup = document.getElementById('confirmGroup');

    // Strength elements
    const strengthFill = document.querySelector('.strength-fill');
    const strengthTextSpan = document.getElementById('strengthText');
    const strengthEmoji = document.getElementById('strengthEmoji');
    const passwordHint = document.getElementById('passwordHint');

    let currentMode = 'login';

    // ----- Helper functions -----
    function sanitizeInput(str) { return str.trim(); }
    function validateName(name) { 
      const trimmed = sanitizeInput(name); 
      if (trimmed.length === 0) return 'Name is required';
      if (trimmed.length < 2) return 'At least 2 characters';
      if (!/^[a-zA-Z\s'-]+$/.test(trimmed)) return 'Only letters, spaces, hyphens';
      return '';
    }
    function validateEmail(email) { 
      const trimmed = sanitizeInput(email); 
      if (trimmed.length === 0) return 'Email is required';
      const re = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/; 
      return re.test(trimmed) ? '' : 'Enter a valid email (e.g., name@domain.com)'; 
    }
    function validatePassword(pw) { 
      if (pw.length === 0) return 'Password is required';
      if (pw.length < 8) return 'Minimum 8 characters'; 
      return ''; 
    }
    function getPasswordStrength(pw) {
      if (!pw) return { level:0, text:'Weak 😡', width:'0%', color:'#f43f5e', hint:'Enter a password' };
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      if (score <= 1) return { level:0, text:'Weak 😡', width:'28%', color:'#f43f5e', hint:'Add uppercase, numbers, or symbols' };
      if (score <= 3) return { level:1, text:'Medium 🙂', width:'65%', color:'#fbbf24', hint:'Add symbols & numbers to strengthen' };
      return { level:2, text:'Strong 😎', width:'100%', color:'#2dd4bf', hint:'Great! Your password is strong' };
    }
    function validateConfirm(pw, confirm) { 
      if (confirm.length === 0) return 'Please confirm your password';
      return pw === confirm ? '' : 'Passwords do not match'; 
    }

    // UI Helpers for field status (error/success)
    function setFieldStatus(group, isValid, errorMsg = '') {
      const errorDiv = group.querySelector('.error-msg');
      if (!isValid) {
        group.classList.add('error');
        group.classList.remove('success');
        errorDiv.classList.remove('hidden');
        errorDiv.innerHTML = `<span>⚠️ ${errorMsg}</span>`;
      } else {
        group.classList.remove('error');
        group.classList.add('success');
        errorDiv.classList.add('hidden');
      }
    }
    function resetFieldGroup(group) { 
      group.classList.remove('error','success'); 
      const errDiv = group.querySelector('.error-msg'); 
      if(errDiv) errDiv.classList.add('hidden'); 
    }

    // Strength UI update
    function updateStrengthUI(pw) {
      if (!pw || pw.length === 0) { 
        strengthFill.style.width = '0%'; 
        strengthTextSpan.innerText = 'Strength'; 
        strengthEmoji.innerText = ''; 
        passwordHint.innerText = ''; 
        return; 
      }
      const strength = getPasswordStrength(pw);
      strengthFill.style.width = strength.width;
      strengthFill.style.backgroundColor = strength.color;
      strengthTextSpan.innerText = strength.text.split(' ')[0];
      strengthEmoji.innerText = strength.text.split(' ')[1] || '';
      passwordHint.innerText = strength.hint;
    }

    // Live validation handlers (with debounce)
    function debounce(fn, delay) { 
      let timer; 
      return function(...args) { 
        clearTimeout(timer); 
        timer = setTimeout(() => fn.apply(this, args), delay); 
      }; 
    }
    
    function handleNameLive() { 
      const val = signupName.value; 
      const err = validateName(val); 
      setFieldStatus(nameGroup, !err, err); 
    }
    function handleEmailLive(emailField, group, isLogin = false) { 
      const err = validateEmail(emailField.value); 
      setFieldStatus(group, !err, err); 
      if (!isLogin && !err && signupEmail.value.trim()) checkDuplicateEmail();
    }
    function handlePasswordLive() { 
      const pw = signupPassword.value; 
      const err = validatePassword(pw); 
      setFieldStatus(signupPassGroup, !err, err); 
      updateStrengthUI(pw); 
      if (confirmPassword.value) handleConfirmLive(); 
    }
    function handleConfirmLive() { 
      const pw = signupPassword.value; 
      const conf = confirmPassword.value; 
      const err = validateConfirm(pw, conf); 
      setFieldStatus(confirmGroup, !err, err); 
    }
    function checkDuplicateEmail() { 
      const email = signupEmail.value.trim(); 
      if (!email) return true;
      const users = JSON.parse(localStorage.getItem('authUsers') || '{}'); 
      if (users[email]) { 
        setFieldStatus(signupEmailGroup, false, 'Email already registered'); 
        return false; 
      } 
      return true; 
    }

    // Attach live listeners
    signupName?.addEventListener('input', debounce(handleNameLive, 250));
    signupEmail?.addEventListener('input', debounce(() => handleEmailLive(signupEmail, signupEmailGroup, false), 250));
    signupPassword?.addEventListener('input', debounce(handlePasswordLive, 180));
    confirmPassword?.addEventListener('input', debounce(handleConfirmLive, 180));
    loginEmail?.addEventListener('input', debounce(() => handleEmailLive(loginEmail, loginEmailGroup, true), 250));
    loginPassword?.addEventListener('input', () => resetFieldGroup(loginPasswordGroup));

    // Ripple effect
    function addRipple(btn, e) {
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - rect.left - size/2}px`;
      ripple.style.top = `${e.clientY - rect.top - size/2}px`;
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 500);
    }

    // Async submit simulation
    async function simulateAsync(btn, actionCallback) {
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> Authenticating...';
      await new Promise(r => setTimeout(r, 750));
      const result = actionCallback();
      btn.disabled = false;
      btn.innerHTML = originalText;
      return result;
    }

    // Auth logic (localStorage)
    function performLogin(email, pass) {
      const users = JSON.parse(localStorage.getItem('authUsers') || '{}');
      const user = users[email];
      if (!user) return 'No account found. Please sign up.';
      if (user.password !== btoa(pass)) return 'Incorrect password.';
      localStorage.setItem('authSession', email);
      return true;
    }
    function performSignup(name, email, pass, confirm) {
      const nameErr = validateName(name); if (nameErr) return nameErr;
      const emailErr = validateEmail(email); if (emailErr) return emailErr;
      const passErr = validatePassword(pass); if (passErr) return passErr;
      const confirmErr = validateConfirm(pass, confirm); if (confirmErr) return confirmErr;
      const users = JSON.parse(localStorage.getItem('authUsers') || '{}');
      if (users[email]) return 'Email already exists.';
      users[email] = { name: sanitizeInput(name), password: btoa(pass) };
      localStorage.setItem('authUsers', JSON.stringify(users));
      localStorage.setItem('authSession', email);
      return true;
    }

    // Submit handlers
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = loginEmail.value.trim();
      const pass = loginPassword.value;
      let emailValid = !validateEmail(email);
      let passValid = pass.length > 0;
      if (!emailValid) setFieldStatus(loginEmailGroup, false, validateEmail(email));
      else resetFieldGroup(loginEmailGroup);
      if (!passValid) setFieldStatus(loginPasswordGroup, false, 'Password required');
      else resetFieldGroup(loginPasswordGroup);
      if (!emailValid || !passValid) return;
      
      const btn = document.getElementById('loginSubmitBtn');
      const res = await simulateAsync(btn, () => performLogin(email, pass));
      if (res === true) { 
        showModal(`Welcome back, ${email.split('@')[0]}!`); 
      } else { 
        setFieldStatus(loginPasswordGroup, false, res); 
      }
    });

    document.getElementById('signupForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = signupName.value;
      const email = signupEmail.value.trim();
      const pass = signupPassword.value;
      const confirm = confirmPassword.value;
      // trigger final validations
      handleNameLive(); 
      handleEmailLive(signupEmail, signupEmailGroup, false); 
      handlePasswordLive(); 
      handleConfirmLive();
      const hasErrors = document.querySelectorAll('#signupForm .input-group.error').length;
      if (hasErrors > 0) return;
      const btn = document.getElementById('signupSubmitBtn');
      const res = await simulateAsync(btn, () => performSignup(name, email, pass, confirm));
      if (res === true) { 
        showModal(`Welcome ${name.split(' ')[0]}! Account created.`); 
      } else { 
        alert(res); 
      }
    });

    function showModal(msg) { 
      modalMessage.innerText = msg; 
      modal.classList.add('active'); 
    }
    closeModalBtn?.addEventListener('click', () => { 
      modal.classList.remove('active'); 
      window.location.reload(); 
    });

    // Mode switching with smooth transitions
    function switchMode(mode) {
      currentMode = mode;
      if (mode === 'login') {
        loginPanel.classList.remove('hidden');
        signupPanel.classList.add('hidden');
        loginPanel.style.animation = 'none';
        loginPanel.offsetHeight;
        loginPanel.classList.add('panel-enter');
      } else {
        signupPanel.classList.remove('hidden');
        loginPanel.classList.add('hidden');
        signupPanel.style.animation = 'none';
        signupPanel.offsetHeight;
        signupPanel.classList.add('panel-enter');
      }
      modeBtns.forEach(btn => {
        if (btn.dataset.mode === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }
    modeBtns.forEach(btn => btn.addEventListener('click', () => switchMode(btn.dataset.mode)));

    // Theme system
    let dark = true;
    function setTheme(isDark) {
      if (!isDark) {
        document.body.classList.add('light');
        themeToggle.innerHTML = '☀️';
      } else {
        document.body.classList.remove('light');
        themeToggle.innerHTML = '🌙';
      }
    }
    themeToggle.addEventListener('click', () => { dark = !dark; setTheme(dark); localStorage.setItem('themePref', dark ? 'dark' : 'light'); });
    const savedTheme = localStorage.getItem('themePref');
    if (savedTheme === 'light') { dark = false; setTheme(false); }
    
    // Click ripple on buttons
    document.querySelectorAll('.submit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => addRipple(btn, e));
    });
  })();
</script>
</body>
