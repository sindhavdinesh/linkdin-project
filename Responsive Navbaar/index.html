<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Navbaar</title>
    <style>
        :root {
            --bg-dark: #050505;
            --neon-danger: #ff003c; 
            --neon-glow: rgba(255, 0, 60, 0.6);
            --glass-bg: rgba(5, 5, 5, 0.8);
            --text-dim: #a0a0a0;
            --nav-height: 80px;
            --font-main: 'Orbitron', 'Segoe UI', sans-serif;
        }

        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: var(--font-main);
            height: 200vh; 
        }

        
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 0, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            z-index: 1000;
            transition: all 0.4s ease;
        }

        .logo {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .logo span {
            color: var(--neon-danger);
        }

        
        .nav-list {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 10px 20px;
            display: block;
            position: relative;
            transition: color 0.3s ease, transform 0.3s ease;
            overflow: hidden; /* For the sweep effect */
        }

        
        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 60, 0.15), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--neon-danger);
            box-shadow: 0 0 15px var(--neon-danger), 0 0 5px #fff;
            transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-link:hover {
            color: #fff;
            transform: scale(1.05);
            text-shadow: 0 0 8px var(--neon-glow);
            animation: glitch-flicker 1.5s infinite;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        
        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1100;
        }

        .bar {
            display: block;
            width: 28px;
            height: 2px;
            margin: 6px auto;
            background-color: var(--neon-danger);
            box-shadow: 0 0 5px var(--neon-danger);
            transition: all 0.3s ease-in-out;
        }

        
        @keyframes glitch-flicker {
            0% { opacity: 1; }
            5% { opacity: 0.8; transform: skewX(1deg); }
            10% { opacity: 1; transform: skewX(0); }
            15% { opacity: 0.9; }
            70% { opacity: 1; }
            80% { opacity: 0.8; transform: skewX(-1deg); }
            100% { opacity: 1; }
        }

    
        @media (max-width: 900px) {
            .hamburger { display: block; }

        
            .hamburger.active .bar:nth-child(2) { opacity: 0; }
            .hamburger.active .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .hamburger.active .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

            .nav-list {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 100%;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: rgba(5, 5, 5, 0.95);
                backdrop-filter: blur(20px);
                transition: 0.6s cubic-bezier(0.77, 0, 0.175, 1);
                gap: 3rem;
            }

            .nav-list.active {
                right: 0;
            }

            .nav-link {
                font-size: 1.5rem;
            }
        }

        
        .nav-link.active {
            border: 1px solid var(--neon-danger);
            box-shadow: inset 0 0 10px var(--neon-glow), 0 0 10px var(--neon-glow);
            color: #fff;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;800&display=swap" rel="stylesheet">
</head>
<body>
 
    <header class="header">
        <a href="#" class="logo">Cyber<span>Navbaar</span></a>
        
        <nav>
            <ul class="nav-list" id="nav-menu">
                <li><a href="#Home" class="nav-link active">Home</a></li>
                <li><a href="#About" class="nav-link">About</a></li>
                <li><a href="#Skill" class="nav-link">Skill</a></li>
                <li><a href="#Portfolio" class="nav-link">Portfolio</a></li>
                <li><a href="#Contact" class="nav-link">Contact</a></li>
            </ul>
        </nav>

        <button class="hamburger" id="btn-hamburger" aria-label="Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>

    <main style="padding: 150px 10% 0;">
        <h2 style="font-size: 3rem; color: var(--neon-danger); text-shadow: 0 0 20px var(--neon-glow);">THREAT DETECTED</h2>
        <p style="color: var(--text-dim); margin-top: 20px; font-family: monospace;">
            [SYSTEM OVERRIDE INITIATED]...<br>
            Hover over the menu items to see the glitch and trail effects.
        </p>
    </main>

    <script>
        const hamburger = document.getElementById('btn-hamburger');
        const navMenu = document.getElementById('nav-menu');
        const navLinks = document.querySelectorAll('.nav-link');

    
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
            
            
            document.body.style.overflow = navMenu.classList.contains('active') ? 'hidden' : 'auto';
        });

        
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                
                navLinks.forEach(l => l.classList.remove('active'));
                
                
                link.classList.add('active');

                
                if(navMenu.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            
            link.addEventListener('mouseenter', () => {
                link.style.animationDuration = (Math.random() * 0.5 + 0.1) + 's';
            });
        });

        
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 50) {
                header.style.height = '70px';
                header.style.background = 'rgba(0, 0, 0, 0.95)';
            } else {
                header.style.height = '80px';
                header.style.background = 'rgba(5, 5, 5, 0.8)';
            }
        });
    </script>
</body>
</html>
