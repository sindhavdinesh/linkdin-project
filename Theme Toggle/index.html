<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Theme Toggle | Production Ready</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Theme Toggle App</h1>
            <p>Experience seamless dark and light mode transitions.</p>
        </header>

        <main>
            <div class="toggle-wrapper">
                <span class="icon">☀️</span>
                <label class="switch">
                    <input type="checkbox" id="theme-checkbox">
                    <span class="slider round"></span>
                </label>
                <span class="icon">🌙</span>
            </div>
            
            <section class="card">
                <h2>Interactive Card</h2>
                <p>This UI adapts instantly to your preferred theme. We use CSS variables to ensure all components update simultaneously without hardcoded color values.</p>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
